<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LocalStorage Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f2f2f2;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 1.8em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .controls input, .controls button {
      padding: 10px;
      font-size: 1em;
      min-width: 150px;
    }

    .controls button {
      cursor: pointer;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 600px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #222;
      color: white;
    }

    tr:hover {
      background: #f9f9f9;
    }

    .editable:hover {
      background: #eef;
      cursor: pointer;
    }

    .edit-btn, .delete-btn {
      cursor: pointer;
      border: none;
      background: none;
      color: #007BFF;
      font-size: 0.95em;
    }

    .edit-btn:hover, .delete-btn:hover {
      text-decoration: underline;
    }

    td input[type="text"] {
      width: 95%;
      padding: 5px;
      font-size: 1em;
    }

    .textarea-container {
      margin: 20px 0;
      width: 100%;
    }

    .auto-expand-textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.4;
      resize: none;
      overflow: hidden;
      transition: height 0.2s;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }
      .controls input, .controls button {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>LocalStorage Editor</h1>

  <div class="controls">
    <input type="text" id="keyInput" placeholder="Key">
    <input type="text" id="valueInput" placeholder="Value">
    <button onclick="addOrUpdate()">Add / Update</button>
    <button onclick="clearAll()">Clear All</button>
  </div>

  <div class="controls">
    <button onclick="copyAll()">Copy localStorage</button>
    <button onclick="importAll()">Import localStorage</button>
  </div>

  <div class="controls">
    <textarea id="importTextarea" rows="6" style="width:100%;" placeholder="Paste localStorage JSON here"></textarea>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Key</th>
          <th>Value (click to edit)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="storageTable"></tbody>
    </table>
  </div>

  <div class="textarea-container">
    <textarea id="localStorageData" class="auto-expand-textarea" placeholder="LocalStorage data will appear here"></textarea>
  </div>
  <div class="controls">
    <button onclick="saveLSDataTextarea()">Save</button>
  </div>

  <script>
    const lsDataTextarea = document.getElementById('localStorageData');
    
    // Function to auto-expand textarea based on content
    function autoExpandTextarea(textarea) {
      // Reset height to auto to get the correct scrollHeight
      textarea.style.height = 'auto';
      // Set the height to scrollHeight to fit all content
      textarea.style.height = textarea.scrollHeight + 'px';
    }
    
    // Initialize the textarea size on load
    window.addEventListener('load', function() {
      autoExpandTextarea(lsDataTextarea);
    });
    
    // Add event listener for input to auto-expand as user types
    lsDataTextarea.addEventListener('input', function() {
      autoExpandTextarea(this);
    });
    
    function saveLSDataTextarea() {
      alert("Not works currently.");
      renderStorage();
    }

    function renderStorage() {
      const table = document.getElementById('storageTable');
      table.innerHTML = '';
      if (localStorage.length === 0) {
        table.innerHTML = '<tr><td colspan="3" style="text-align:center;">No data</td></tr>';
        lsDataTextarea.value = '';
        autoExpandTextarea(lsDataTextarea);
        return;
      }
      
      const lsObj = {}

      Object.keys(localStorage).forEach(key => {
        const value = localStorage.getItem(key);

        try {
          lsObj[key] = JSON.parse(value);
        }
        catch (e) {
          lsObj[key] = value;
        }
        
        const row = document.createElement('tr');

        const keyCell = document.createElement('td');
        keyCell.textContent = key;

        const valueCell = document.createElement('td');
        valueCell.className = 'editable';
        valueCell.textContent = value;
        valueCell.addEventListener('click', () => makeEditable(valueCell, key));

        const actionCell = document.createElement('td');
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = 'Delete';
        delBtn.onclick = () => deleteItem(key);
        actionCell.appendChild(delBtn);

        row.appendChild(keyCell);
        row.appendChild(valueCell);
        row.appendChild(actionCell);
        table.appendChild(row);
      });

      lsDataTextarea.value = JSON.stringify(lsObj, null, 2);
      autoExpandTextarea(lsDataTextarea);
    }

    function makeEditable(td, key) {
      const originalValue = td.textContent;
      const input = document.createElement('input');
      input.type = 'text';
      input.value = originalValue;
      input.addEventListener('blur', () => {
        localStorage.setItem(key, input.value);
        renderStorage();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') {
          input.value = originalValue;
          input.blur();
        }
      });
      td.textContent = '';
      td.appendChild(input);
      input.focus();
      input.select();
    }

    function addOrUpdate() {
      const key = document.getElementById('keyInput').value.trim();
      const value = document.getElementById('valueInput').value;
      if (!key) {
        alert("Key cannot be empty");
        return;
      }
      localStorage.setItem(key, value);
      document.getElementById('keyInput').value = '';
      document.getElementById('valueInput').value = '';
      renderStorage();
    }

    function deleteItem(key) {
      if (confirm(`Delete key "${key}"?`)) {
        localStorage.removeItem(key);
        renderStorage();
      }
    }

    function clearAll() {
      if (confirm("Are you sure you want to clear all localStorage data?")) {
        localStorage.clear();
        renderStorage();
      }
    }
    
    function copyAll() {
      const data = JSON.stringify(localStorage, null, 2);
      navigator.clipboard.writeText(data).then(() => {
        alert("localStorage copied to clipboard.");
      }).catch(err => {
        alert("Failed to copy: " + err);
      });
    }

    function importAll() {
      const input = document.getElementById('importTextarea').value;
      if (!input.trim()) {
        alert("Textarea is empty.");
        return;
      }
      let data;
      try {
        data = JSON.parse(input);
      } catch (e) {
        alert("Invalid JSON format.");
        return;
      }
      if (typeof data !== 'object' || Array.isArray(data)) {
        alert("JSON must be an object with key-value pairs.");
        return;
      }
      if (!confirm("This will overwrite existing keys. Continue?")) return;
      for (const key in data) {
        if (typeof data[key] !== 'string') {
          alert(`Value for key "${key}" must be a string.`);
          return;
        }
        localStorage.setItem(key, data[key]);
      }
      renderStorage();
      alert("Import completed.");
    }

    renderStorage();
  </script>
</body>
</html>
