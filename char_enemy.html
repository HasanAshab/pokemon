<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/char_enemy.css">
  <style>
  </style> 
  <title>Character Selection</title>
</head>
<body>
    <div class="blur-bg ">
      <div class="pop-list-form">
         
    </div>
    </div>
       <div class="fields-cont">
        <div style="background-color:var(--Fire-type-color)"  onclick="fieldClickHandler(event)" class="field fire">
          Fire
        </div>
        <div style="background-color:var(--Water-type-color)"  onclick="fieldClickHandler(event)" class="field water">
          Water
        </div>
        <div style="background-color:var(--Electric-type-color)"  onclick="fieldClickHandler(event)" class="field electric">
          Electric
        </div>
        <div style="background-color:var(--Grass-type-color)"  onclick="fieldClickHandler(event)" class="field grass">
          Grass
        </div>
        <div style="background-color:var(--Ice-type-color)"  onclick="fieldClickHandler(event)" class="field ice">
          Ice
        </div>
        <div style="background-color:var(--Fighting-type-color)"  onclick="fieldClickHandler(event)" class="field fighting">
          Fighting
        </div>
        <div style="background-color:var(--Poison-type-color)"  onclick="fieldClickHandler(event)" class="field poison">
          Poison
        </div>
        <div style="background-color:var(--Ground-type-color)"  onclick="fieldClickHandler(event)" class="field ground">
          Ground
        </div>
        <div style="background-color:var(--Flying-type-color)"  onclick="fieldClickHandler(event)" class="field flying">
          Flying
        </div>
        <div style="background-color:var(--Psychic-type-color)"  onclick="fieldClickHandler(event)" class="field psychic">
          Psychic
        </div>
        <div style="background-color:var(--Bug-type-color)" data-index="10" onclick="fieldClickHandler(event)" class="field bug">
          Bug
        </div>
        <div style="background-color:var(--Rock-type-color)" data-index="11" onclick="fieldClickHandler(event)" class="field rock">
          Rock
        </div>
        <div style="background-color:var(--Ghost-type-color)" data-index="12" onclick="fieldClickHandler(event)" class="field ghost">
          Ghost
        </div>
        <div style="background-color:var(--Dragon-type-color)" data-index="13" onclick="fieldClickHandler(event)" class="field dragon">
          Dragon
        </div>
        <div style="background-color:var(--Dark-type-color)" data-index="14" onclick="fieldClickHandler(event)" class="field dark">
          Dark
        </div>
        <div style="background-color:var(--Steel-type-color)" data-index="15" onclick="fieldClickHandler(event)" class="field steel">
          Steel
        </div>
        <div style="background-color:var(--Fairy-type-color)" data-index="16" onclick="fieldClickHandler(event)" class="field fairy">
          Fairy
        </div>
        <div style="background-color:var(--Normal-type-color)" data-index="17" onclick="fieldClickHandler(event)" class="field normal">
          Normal
        </div>
      </div>
   <button onclick="selectRandomFields()" class="select-random-fields-btn">Random Fields</button>
   <button onclick="copyFields()" class="copy-fields-btn">copy fields</button>
   <button onclick="startLastBattle()">Last Battle</button>
  <br><br>
  <a onclick="redirectToNewInterface()" >New Interface</a>
  <div class="charecter-choose-form">
      <h2 class="title">charecters</h2>
      <div class="charecters-list"></div>
  </div>

  <div class="battle-history">
    <h3>Battle History</h3>
    <div class="history-list"></div>
    <button onclick="clearHistory()">Clear</button>
  </div>
  <br><br>  

  <select id="sys-select"></select>

</body>
<script type="module" src="./assets/js/char_enemy.js"></script>
</html>
