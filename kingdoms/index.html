<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kingdom Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="addKingdomBtn">Add Kingdom</button>
  <div class="card-container" id="cardContainer"></div>
  <div id="disasterReport" style="display: none; margin-top: 20px; padding: 20px; border: 2px solid #ff6b6b; border-radius: 8px; background-color: #ffe0e0;">
    <h2>🚨 Current Disaster Report</h2>
    <div id="disasterContent"></div>
    <div style="margin-top: 10px;">
      <button id="generateNewDisasters" style="margin-right: 10px; background-color: #dc3545; color: white;">Generate New Disasters</button>
      <button id="closeDisasterReport">Close Report</button>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
