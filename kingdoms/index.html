<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta class="mobile-meta" name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta class="mobile-meta" http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Kingdom Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="top-controls">
    <button id="addKingdomBtn">Add Kingdom</button>
    <div class="view-toggle">
      <button id="networkViewBtn" class="view-btn" onclick="window.location.href='network.html'">Network</button>
      <button id="mapViewBtn" class="view-btn" onclick="window.location.href='./map/index.html'">Map</button>
    </div>
  </div>

  <!-- Card View -->
  <div id="cardView" class="kingdoms-network">
    <svg id="connectionLines" class="connection-svg"></svg>
    <div class="card-container" id="cardContainer"></div>
  </div>
  <div id="disasterReport"
    style="display: none; margin-top: 20px; padding: 20px; border: 2px solid #ff6b6b; border-radius: 8px; background-color: #ffe0e0;">
    <div class="disaster-controls">
      <label for="disasterSuppressor">Disaster Power Suppressor:</label>
      <input type="number" id="disasterSuppressor" step="0.1"/>
    </div>
    <h2>🚨 Current Disaster Report</h2>
    <div id="disasterContent"></div>
    <div style="margin-top: 10px;">
      <button id="generateNewDisasters" style="margin-right: 10px; background-color: #dc3545; color: white;">Generate
        6-Month Forecast</button>
      <button id="nextMonthBtn" style="margin-right: 10px; background-color: #28a745; color: white;">Next Month</button>
      <button id="closeDisasterReport">Close Report</button>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>

</html>
