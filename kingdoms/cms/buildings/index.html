<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Buildings</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .go-to-top-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      z-index: 1000;
      display: none;
    }
    
    .go-to-top-btn:hover {
      background: #0056b3;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }
    
    .go-to-top-btn.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    
    .warning-btn {
      background-color: #ffc107;
      color: #212529;
    }
    
    .warning-btn:hover {
      background-color: #e0a800;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="kingdomName">Kingdom Buildings</h1>
      <div class="header-controls">
        <button id="addBuildingBtn" class="btn primary-btn">Add New Building</button>
        <button id="deleteDisabledBtn" class="btn danger-btn">Delete All Disabled</button>
        <button id="deleteExpiredBtn" class="btn warning-btn">Delete All Expired</button>
        <button id="quickFindBtn" onclick="showQuickFindForm()">Quick Find</button>
      </div>
      </div>
    <div id="quickFindForm">
      <div class="header">
        <h3>quick find</h3>
        <button class="close-btn" onclick="hideQuickFindForm()">x</button>
      </div>
      <div class="controler-bar">
<label>
  Owned By:
  <select class="owned-by">
    
  </select>
</label>

<label>
  Property Type:
  <select class="property">
    <option selected="true" value="all">all</option>
    <option value="govt">Govt</option>
    <option value="private">Private</option>
    <option value="rent">Rent</option>
  </select>
</label>

<label>
  <input class="sort-by-size" type="checkbox">
  Sort by Size
</label>

<label>
  <input class="show-size" type="checkbox">
  Show Size
</label>

<label>
  <input class="show-quantity" type="checkbox">
  Show Quantity
</label>

<label>
  <input class="show-only-expirable" type="checkbox">
  Show Only Expirable
</label>
        
      </div>
      <div class="links-container">
        
      </div>
    </div>

    </header>

    <div id="buildingsContainer" class="buildings-container"></div>
    
    <!-- Sticky Go to Top Button -->
    <button id="goToTopBtn" class="go-to-top-btn" onclick="scrollToTop()" title="Go to top">
      ↑
    </button>
  </div>
  <datalist id="companiesDataList"></datalist>
  <script type="module" src="script.js"></script>
</body>
</html>
