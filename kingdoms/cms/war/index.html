<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>War</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <div class="container">

    <h1 id="kingdomName">Kingdom</h1>
    <div class="war-settings">
      <div class="form-group">
        <label for="attacker">Attacker:</label>
        <select id="attacker"></select>
      </div>

      <div class="form-group">
        <label for="defender">Defender:</label>
        <select id="defender"></select>
      </div>

      <div class="form-group">
        <label for="warStrategy">Strategy:</label>
        <select id="warStrategy"></select>
        <label for="shift">Shift:</label>
        <select id="shift">
          <option value="day">Day</option>
          <option value="night">Night</option>
        </select>
        <label for="direction">Direction:</label>
        <select id="direction"></select>
      </div>
      <p class="msg good">good</p>
      <p class="msg bad">bad</p>
      <div class="form-group">
        <label for="areaPercentage">Area Percentage:</label>
        <input type="range" id="areaPercentage" min="0" max="100" value="100">
        <span id="areaPercentageLabel">100%</span>
        <input type="number"  id="actualArea" placeholder="actual Area"/>
      </div>
    </div>

    <div id="wavesList" class="waves-list"></div>
    <button id="addWaveBtn" class="add-wave-btn">Add Attack Wave</button>
    <button id="startWar" class="start-war-btn">Start War</button>
  </div>
  <br>
  <div class="container">
    <h3>Send Espionage</h3>
    <div class="espionage-form">
      <button id="setSecurityBtn" class="btn secondary-btn">Set Security Rate</button>
      
      <div class="form-group security-override" id="securityOverride" style="display: none;">
        <label for="targetSecurity">Target's Security:</label>
        <input type="range" id="targetSecurity" min="1" max="100" value="50">
        <span id="targetSecurityLabel">50</span>
      </div>
      
      <div class="form-group">
        <label for="dataLevel">Data Level:</label>
        <input type="number" id="dataLevel" min="0" max="10" value="1">
      </div>
      
      <div class="form-group">
        <label for="manCount">Mans:</label>
        <input type="number" id="manCount" min="1" value="1">
      </div>
      
      <div class="espionage-info">
        <div>Risk: <span id="riskDisplay">30%</span></div>
        <div>Cost: <span id="costDisplay">3000</span></div>
      </div>
      
      <button id="sendEspionageBtn" class="btn primary-btn">Send</button>
    </div>
    
    <div id="espionageResult" class="espionage-result"></div>
  </div>
  <br>
   <div class="container defender-data">
    <h3>Espionage Report</h3>
    <div id="defender-data"></div>
    <br>
    <input style="width: 25px;" type="number" id="expose-level-inp" value="0" min="0" oninput="showDefenderData()" />
  </div>
  <br>

  <div class="container data-box" id="atk">
    <h4 class="title">Attacker Options</h4>
    <div class="data-rows-wrapper">
      <div class="data-row">
        <input type="text" class="key" placeholder="Key" value="morality"/>
        <input type="text" class="value" placeholder="Value" value="100"/>
        <button class="remove-btn" onclick="removeRow('atk', event)">-</button> 
      </div>
    </div>
    <button id="add-data" onclick="addDataRow('atk')">Add Data</button>
  </div>
  <br>
  <div class="container data-box" id="def">
    <h4 class="title">Deffender Options</h4>
    <div class="data-rows-wrapper">
      <div class="data-row">
        <input type="text" class="key" placeholder="Key" value="morality"/>
        <input type="text" class="value" placeholder="Value" value="100"/>
        <button class="remove-btn" onclick="removeRow('def', event)">-</button> 
      </div>
    </div>
    <button id="add-data" onclick="addDataRow('def')">Add Data</button>
  </div>
  <br>
     <div class="container data-box" id="harvest">
    <h4 class="title">Harvest Options</h4>
    <div class="data-rows-wrapper">
    </div>
    <button id="add-data" onclick="addDataRow('harvest')">Add Data</button>
  </div>
  <br>
  <div class="container">
    <h3>War Result</h3>
    <div id="war-data"> </div>
  </div>
  <br>
  <script type="module" src="script.js"></script>
</body>

</html>
