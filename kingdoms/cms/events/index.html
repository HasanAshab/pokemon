<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Events</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .events-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .events-section {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 20px;
    }
    
    .events-section h3 {
      margin: 0 0 15px 0;
      color: #495057;
    }
    
    .event-form {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 6px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .form-group label {
      font-weight: 500;
      color: #495057;
      font-size: 14px;
    }
    
    .form-group input {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
    }
    
    .form-group input[type="number"] {
      width: 80px;
    }
    
    .form-group input[type="checkbox"] {
      width: auto;
    }
    
    .event-item {
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }
    
    .event-item.happening {
      border-color: #dc3545;
      background: #fff5f5;
    }
    
    .event-item.secret {
      border-color: #6c757d;
      background: #f8f9fa;
    }
    
    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .event-title {
      font-weight: bold;
      color: #495057;
    }
    
    .event-countdown {
      font-size: 12px;
      color: #6c757d;
      background: #e9ecef;
      padding: 4px 8px;
      border-radius: 12px;
    }
    
    .event-countdown.happening {
      background: #dc3545;
      color: white;
    }
    
    .event-description {
      color: #6c757d;
      margin-bottom: 10px;
      font-family: monospace;
      word-break: break-all;
      font-size: 14px;
    }
    
    .event-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .event-controls label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }
    
    .past-events-toggle {
      margin-bottom: 15px;
    }
    
    .past-events-list {
      display: none;
    }
    
    .past-events-list.show {
      display: block;
    }
    
    @media (max-width: 768px) {
      .event-form {
        flex-direction: column;
        align-items: stretch;
      }
      
      .form-group input, .form-group textarea {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="kingdomName">Kingdom Events</h1>
    </header>

    <div class="events-container">
      <!-- Add New Event Section -->
      <div class="events-section">
        <h3>Add New Event</h3>
        <div class="event-form">
          <div class="form-group">
            <label for="eventTitle">Title:</label>
            <input type="text" id="eventTitle" placeholder="Event title" />
          </div>
          <div class="form-group">
            <label for="eventYears">Years:</label>
            <input type="number" id="eventYears" min="0" value="0" />
          </div>
          <div class="form-group">
            <label for="eventMonths">Months:</label>
            <input type="number" id="eventMonths" min="0" value="1" />
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="eventSecret" />
              Secret Event
            </label>
          </div>
          <button id="addEventBtn" class="btn primary-btn">Add Event</button>
        </div>
      </div>

      <!-- Future Events Section -->
      <div class="events-section">
        <h3>Future Events (<span id="futureEventsCount">0</span>)</h3>
        <div id="futureEventsList" class="events-list"></div>
      </div>

      <!-- Past Events Section -->
      <div class="events-section">
        <h3>Past Events (<span id="pastEventsCount">0</span>)</h3>
        <div class="past-events-toggle">
          <button id="togglePastEventsBtn" class="btn secondary-btn">Show Past Events</button>
        </div>
        <div id="pastEventsList" class="events-list past-events-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
