<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Government Employees</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="kingdomName">Kingdom Employees</h1>
      <div class="total-salary-display">
        <strong>Total Salary: $<span id="totalEmployeeSalary">0</span></strong>
      </div>
      <button id="addEmployeeBtn" class="btn primary-btn">+ Add Employee</button>
    </header>

    <div class="employees-container">
      <div class="table-wrapper">
        <table id="employeesTable">
          <thead>
            <tr>
              <th>Post Name</th>
              <th>Salary %</th>
              <th>Quantity</th>
              <th>Per Man</th>
              <th>Total</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
