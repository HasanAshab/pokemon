<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Storage</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .lifetime-tracker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 5px;
    }
    
    .lifetime-tracker label {
      font-weight: bold;
      color: #333;
    }
    
    .lifetime-tracker input {
      width: 60px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
      text-align: center;
    }
    
    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    header h1 {
      margin: 0;
    }
    
    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    /* Tab Styles */
    .tabs {
      display: flex;
      border-bottom: 2px solid #dee2e6;
      margin-bottom: 20px;
    }
    
    .tab {
      padding: 12px 24px;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-bottom: none;
      cursor: pointer;
      font-weight: 500;
      color: #495057;
      transition: all 0.3s ease;
    }
    
    .tab:first-child {
      border-top-left-radius: 6px;
    }
    
    .tab:last-child {
      border-top-right-radius: 6px;
    }
    
    .tab.active {
      background: white;
      color: #007bff;
      border-bottom: 2px solid white;
      margin-bottom: -2px;
    }
    
    .tab:hover:not(.active) {
      background: #e9ecef;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    /* Marketplace Styles */
    .marketplace-container {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .marketplace-form {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 6px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .form-group label {
      font-weight: 500;
      color: #495057;
      font-size: 14px;
    }
    
    .form-group input, .form-group select {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
    }
    
    .form-group input[type="number"] {
      width: 100px;
    }
    
    .form-group input[type="checkbox"] {
      width: auto;
    }
    
    .marketplace-table {
      width: 100%;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: white;
    }
    
    .marketplace-table table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .marketplace-table th,
    .marketplace-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #dee2e6;
      white-space: nowrap;
    }
    
    .marketplace-table th {
      background: #f8f9fa;
      font-weight: 600;
      color: #495057;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .marketplace-table tr:hover {
      background: #f8f9fa;
    }
    
    .profit-positive {
      color: #28a745;
      font-weight: bold;
    }
    
    .profit-negative {
      color: #dc3545;
      font-weight: bold;
    }
    
    .profit-neutral {
      color: #6c757d;
    }
    
    .overall-profit {
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }
    
    @media (max-width: 768px) {
      .marketplace-form {
        flex-direction: column;
        align-items: stretch;
      }
      
      .form-group input, .form-group select {
        width: 100%;
      }
      
      .marketplace-table {
        font-size: 14px;
      }
      
      .marketplace-table th,
      .marketplace-table td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="kingdomName">Kingdom Storage</h1>
      <div class="lifetime-tracker">
        <label>Kingdom Age:</label>
        <input type="number" id="lifetimeYears" placeholder="Years" min="0"> Years
        <input type="number" id="lifetimeMonths" placeholder="Months" min="0" max="11"> Months
      </div>
      <div class="header-controls">
        <button id="newMonthBtn" class="btn special-btn">New Month</button>
        <button id="addItemBtn" class="btn primary-btn">Add New Item</button>
      </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="items">Items</div>
      <div class="tab" data-tab="marketplace">Marketplace</div>
    </div>

    <!-- Items Tab Content -->
    <div id="itemsTab" class="tab-content active">
      <div id="itemsContainer" class="items-container"></div>
    </div>

    <!-- Marketplace Tab Content -->
    <div id="marketplaceTab" class="tab-content">
      <div class="marketplace-container">
        <h3>Add Marketplace Item</h3>
        <div class="marketplace-form">
          <div class="form-group">
            <label for="marketItemSelect">Item:</label>
            <select id="marketItemSelect">
              <option value="">Select an item</option>
            </select>
          </div>
          <div class="form-group">
            <label for="unitPrice">Unit Price:</label>
            <input type="number" id="unitPrice" step="0.01" placeholder="Can be negative" />
          </div>
          <div class="form-group">
            <label for="actionType">Action:</label>
            <select id="actionType">
              <option value="sell">Sell</option>
              <option value="buy">Buy</option>
            </select>
          </div>
          <div class="form-group" id="sellAllGroup">
            <label>
              <input type="checkbox" id="sellAll" />
              Sell All
            </label>
          </div>
          <div class="form-group" id="buyWholeDemandGroup" style="display: none;">
            <label>
              <input type="checkbox" id="buyWholeDemand" />
              Buy Whole Demand
            </label>
          </div>
          <div class="form-group" id="quantityGroup">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" min="1" value="1" />
          </div>
          <button id="addMarketItemBtn" class="btn primary-btn">Add to Marketplace</button>
        </div>
      </div>

      <div class="marketplace-table">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Action</th>
              <th>Unit Price</th>
              <th>Quantity</th>
              <th>Total Profit/Cost</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="marketplaceTableBody">
            <!-- Marketplace items will be populated here -->
          </tbody>
        </table>
      </div>

      <div id="overallProfit" class="overall-profit">
        Overall Profit: <span id="overallProfitValue">$0</span>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
