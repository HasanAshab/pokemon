<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Commanders</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <h1 id="commandersTitle"></h1>
  <button id="addCommanderBtn">+ Add Commander</button>
  <div id="commandersContainer"></div>

  <!-- JSON editor modal -->
  <div id="jsonEditorModal" class="modal hidden">
    <textarea id="jsonEditor" rows="30" cols="50"></textarea>
    <div class="modal-actions">
      <button id="saveJsonBtn">Save JSON</button>
      <button id="cancelJsonBtn">Cancel</button>
    </div>
  </div>
  <datalist id="traits">
    <option value="offensive"></option>
    <option value="defensive"></option>
  </datalist>
  <script type="module" src="script.js"></script>
</body>
</html>
