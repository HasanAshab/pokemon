<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Militia</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="bottom-cards">
  <div class="info-card" data-target="commanders">Commanders</div>
  <div class="info-card" data-target="barrack">Barrack</div>
  <div class="info-card" data-target="defence">Defence</div>
</div>
    <h1 style="text-align: center;">Military Stats</h1>
    
    <!-- Military Stats Section -->
    <div class="stats-section">
      <div class="stats-summary">
        <div class="stats-item total">
          <span class="label">Total Power (CP):</span>
          <span class="value" id="totalPower">0</span>
        </div>
      </div>
      
      <div class="power-breakdown" id="powerBreakdown">
        <!-- Power breakdown will be populated by JavaScript -->
      </div>
      
      <div class="stats-breakdown" id="statsBreakdown">
        <!-- Stats breakdown will be populated by JavaScript -->
      </div>
    </div>

    <h1 style="text-align: center;">Military Budget</h1>
    
    <!-- Military Budget Section -->
    <div class="budget-section">
      <div class="budget-summary">
        <div class="budget-item total">
          <span class="label">Total:</span>
          <span class="value" id="totalBudget">$0</span>
        </div>
        <div class="budget-item percentage">
          <span class="label">Percentage of Tax:</span>
          <span class="value" id="budgetPercentage">0%</span>
        </div>
      </div>
      
      <div class="budget-breakdown" id="budgetBreakdown">
        <!-- Budget breakdown will be populated by JavaScript -->
      </div>
    </div>

  <script type="module" src="script.js"></script>
</body>
</html>
