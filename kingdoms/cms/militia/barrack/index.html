<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Barrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="barrackTitle">Barrack</h1>
 <button onclick="redirectToAcademyPage()">Academy</button>
  <section style="display:none" id="academySection">
    <h2>Academy</h2>
    <div>
      <span>Level:</span>
      <button id="decrAcademy">-</button>
      <span id="academyLevel">1</span>
      <button id="incrAcademy">+</button>
    </div>
    <div>Monthly Cost: <span id="academyCost">100</span> coins</div>
  </section>
  
  <div id="main-header">
    <button onclick="showTab(event,'soldier')" class="active" id="soldiers">
     soldiers
    </button>
    <button onclick="showTab(event,'police')" id="polices">
      polices
    </button>
  </div>
  <section id="dayPolicesSection" class="tab-police tab">
    <h2>Day Polices</h2>
    <h4>Might: <span id="dayPolicesMight">0</span></h4>
    <button id="addDayPoliceBtn">+ Add Day Police</button>
    <div id="dayPolicesContainer"></div>
  </section>
  <section id="nightPolicesSection" class="tab-police tab">
    <h2>Night Polices</h2>
    <h4>Might: <span id="nightPolicesMight">0</span></h4>
    <button id="addNightPoliceBtn">+ Add Night Police</button>
    <div id="nightPolicesContainer"></div>
  </section>
  <section class="tab-soldier active tab"><h2>Total Might: <span id="soldiersMight">0</span></h2></section>
  <section id="imbalance-section" class="balanced tab-soldier active tab">
      <button onclick="showImbalanceData()" class="show-imbalance-data-btn" type="submit">Show imbalance data</button>
   <p>Everything is balanced 🎉</p>
      <div class="shifts-data-wrapper"></div>
  </section>
  <section id="daySoldiersSection" class="tab-soldier active tab">
    <h2>Day Soldiers</h2>
    <h4>Might: <span id="daySoldiersMight">0</span></h4>
    <button id="addDaySoldierBtn">+ Add Day Soldier</button>
    <div id="daySoldiersContainer"></div>
  </section>

  <section id="nightSoldiersSection" class="tab-soldier active tab">
    <h2>Night Soldiers</h2>
    <h4>Might: <span id="nightSoldiersMight">0</span></h4>
    <button id="addNightSoldierBtn">+ Add Night Soldier</button>
    <div id="nightSoldiersContainer"></div>
  </section>

  <section id="emergencySoldiersSection" class="tab-soldier active tab">
    <h2>Emergency Soldiers</h2>
    <h4>Might: <span id="emergencySoldiersMight">0</span></h4>
    <button id="addEmergencySoldierBtn">+ Add Emergency Soldier</button>
    <div id="emergencySoldiersContainer"></div>
  </section>
  <datalist id="pokemon-data-list"></datalist>
  <script type="module" src="script.js"></script>
</body>
</html>
