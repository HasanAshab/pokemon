<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../../../assets/css/multy-input-box.css">

</head>

<body>
  <h2 id="main-heading">ammo</h2>
  
  <div class="navigation-buttons">
    <button onclick="window.location.href='./items/index.html'" class="nav-btn">📚 Items Book</button>
  </div>
  
            <div class="table-container">
   <table id="items-table">
      <thead>
          <tr>
              <th>Item</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Cost</th>
          </tr>
      </thead>
      <tbody></tbody>
  </table>
            </div>
            
  <div class="table-actions">
    <button onclick="setDefaultPrices()" class="action-btn">Set Def Price</button>
  </div>
  <div class="soldier-shifts-container">
    <div class="shift day">
      <h2>Day:</h2>
      <div class="soldier-ammo-cards-container">
        <div class="soldier-ammo-card">
          <div class="header">
            <h3 class="rank">rank</h3>
          </div>
          <div class="body">
            <div class="multy-input-box" data-property="items" data-index="0">
              <div class="inputs-wrapper">
              </div>
              <div class="controller">

                <datalist id="multy-input-box-datalist"></datalist>
                <button class="add-input-btn">Add</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bulk-operations-container">
    <h3>Bulk Operations</h3>
    <div class="bulk-operation-section">
      <h4>Add Item to All Soldiers with Same Image</h4>
      <div class="bulk-controls">
        <select id="soldier-image-select" onchange="updateBulkAddDatalist()">
          <option value="">Select Soldier Image</option>
        </select>
        <input type="text" id="bulk-add-item" placeholder="Item name" list="bulk-add-datalist" />
        <datalist id="bulk-add-datalist"></datalist>
        <button onclick="bulkAddItem()">Add to All</button>
      </div>
    </div>
    
    <div class="bulk-operation-section">
      <h4>Remove Item from All Soldiers with Same Image</h4>
      <div class="bulk-controls">
        <select id="soldier-image-select-remove" onchange="updateBulkRemoveDatalist()">
          <option value="">Select Soldier Image</option>
        </select>
        <input type="text" id="bulk-remove-item" placeholder="Item name" list="bulk-remove-datalist" />
        <datalist id="bulk-remove-datalist"></datalist>
        <button onclick="bulkRemoveItem()">Remove from All</button>
      </div>
    </div>
    
    <div class="bulk-operation-section">
      <h4>Copy From Shift to Shift</h4>
      <div class="bulk-controls">
        <select id="copy-from-shift-select">
          <option value="">Select Source Shift</option>
          <option value="day">Day</option>
          <option value="night">Night</option>
          <option value="emergency">Emergency</option>
        </select>
        <span>to</span>
        <select id="copy-to-shift-select">
          <option value="">Select Target Shift</option>
          <option value="day">Day</option>
          <option value="night">Night</option>
          <option value="emergency">Emergency</option>
        </select>
        <button onclick="copyFromShiftToShift()">Copy</button>
      </div>
    </div>
    
    <div class="bulk-operation-section">
      <h4>Copy From Another Kingdom</h4>
      <div class="bulk-controls">
        <select id="copy-from-kingdom-select">
          <option value="">Select Kingdom</option>
        </select>
        <datalist id="bulk-remove-datalist"></datalist>
        <button onclick="copyFromAnotherKingdom()">Copy</button>
      </div>
    </div>
  </div>
</body>
<script type="module" src="script.js"></script>

</html>
