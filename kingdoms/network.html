<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kingdom Network</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-controls">
    <button id="backToCardsBtn">← Back to Cards</button>
    <h1>Kingdom Network</h1>
  </div>
  
  <!-- Network Topology View -->
  <div id="networkView" class="network-topology">
    <div class="topology-container">
      <svg id="topologyCanvas" class="topology-canvas"></svg>
      <div id="topologyNodes" class="topology-nodes"></div>
    </div>
    <div class="network-legend">
      <h3>Legend</h3>
      <div class="legend-item">
        <div class="legend-node normal"></div>
        <span>Normal Kingdom</span>
      </div>
      <div class="legend-item">
        <div class="legend-node war"></div>
        <span>At War</span>
      </div>
      <div class="legend-item">
        <div class="legend-node disaster"></div>
        <span>Has Disasters</span>
      </div>
      <div class="legend-item">
        <div class="legend-line"></div>
        <span>Connection</span>
      </div>
    </div>
  </div>
  
  <script type="module" src="network.js"></script>
</body>
</html>
