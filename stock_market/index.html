<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Stock Market Simulation</title>
    <script src="../shared/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="user-selector-section">
            <h1>Stock Market Simulation</h1>
            <div class="user-selector">
                <label for="userSelect">Current User:</label>
                <select id="userSelect" onchange="switchUser()">
                    <option value="Hasan">Hasan</option>
                    <option value="Hossain">Hossain</option>
                </select>
            </div>
        </div>
        
        <div class="section wallet">
            <h2>My Wallet</h2>
            <div class="wallet-info">
                <div class="coins-display">
                    <label>Coins: $</label>
                    <input type="number" id="coinsInput" placeholder="0" onblur="updateCoins()">
                </div>
                <div class="portfolio-value">
                    <strong>Portfolio Value: $<span id="portfolioValue">0</span></strong>
                </div>
            </div>
        </div>

        <div class="section portfolio-chart">
            <h2>Stock Portfolio Value History</h2>
            <div class="chart-container">
                <canvas id="portfolioChart"></canvas>
            </div>
        </div>

        <div class="section controls">
            <button onclick="showCreateStockModal()" class="btn primary-btn">Create New Stock Company</button>
            <button onclick="sellAllShares()" class="btn warning-btn">Sell All Shares</button>
            <button onclick="simulateNewMonth()" class="btn special-btn">New Month</button>
        </div>

        <div class="section stocks">
            <h2>Stock Companies</h2>
            <div class="table-container">
                <table id="stocksTable">
                    <thead>
                        <tr>
                            <th onclick="sortTable(0)" class="sortable">Company Name <span class="sort-indicator">↕</span></th>
                            <th onclick="sortTable(1)" class="sortable">Current Price ($) <span class="sort-indicator">↕</span></th>
                            <th onclick="sortTable(2)" class="sortable">Change <span class="sort-indicator">↕</span></th>
                            <th onclick="sortTable(3)" class="sortable">My Shares <span class="sort-indicator">↕</span></th>
                            <th onclick="sortTable(4)" class="sortable">My Investment ($) <span class="sort-indicator">↕</span></th>
                            <th>Rate %</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Stock Modal -->
    <div id="createStockModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="hideCreateStockModal()">&times;</span>
            <h3>Create New Stock Company</h3>
            <div class="form-group">
                <label>Company Name:</label>
                <input type="text" id="newStockName" placeholder="Enter company name">
            </div>
            <div class="form-group">
                <label>Initial Stock Price ($):</label>
                <input type="number" id="newStockPrice" placeholder="100" min="1">
            </div>
            <div class="form-group">
                <label>Min Change Rate (%):</label>
                <input type="range" id="newStockMinChange" min="-50" max="0" value="-10">
                <span id="minChangeDisplay">-10%</span>
            </div>
            <div class="form-group">
                <label>Max Change Rate (%):</label>
                <input type="range" id="newStockMaxChange" min="0" max="50" value="15">
                <span id="maxChangeDisplay">15%</span>
            </div>
            <button onclick="createStock()" class="btn primary-btn">Create Stock</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
