<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Controle management system</title>
  <script src="../shared/chart.js"></script>
  <link rel="stylesheet" href="./cms.css">
</head>

<body>
  <div class="container">
    <h1 id="companyName">Company Name</h1>

    <div class="section storage">
      <h2>Storage Management</h2>
      <div class="storage-header">
        <button id="addItemBtn" class="btn primary-btn">Add New Item</button>
        <button id="newMonthBtn" onclick="processMonthlyChanges()" class="btn special-btn">Process Monthly Changes</button>
      </div>
      <div id="itemsContainer" class="items-container"></div>
    </div>
    <div class="section revenue-chart">
      <h2>Monthly Revenue Chart</h2>
      <div class="chart-container">
        <canvas id="revenueChart"></canvas>
      </div>
      <div class="input-group">
        <input type="number" id="low" placeholder="Low Revenue Estimate" onchange="saveEstimates()">
        <input type="number" id="medium" placeholder="Medium Revenue Estimate"
          onchange="saveEstimates(); updateWorth();" oninput="updateWorth()">
        <input type="number" id="high" placeholder="High Revenue Estimate" onchange="saveEstimates()">
      </div>
      <div id="companyWorth">Total Worth $: 0</div>
      <button onclick="addRevenue()">New Month</button>
      <button onclick="deleteLastMonthRevenue()" class="delete-btn" style="margin-left: 10px;">Delete last Month Revenue</button>
    </div>

    <!-- Employee Salary Management Section -->
    <div class="section salary">
      <h2>Employee Salary Management</h2>
      <div class="table-container">
        <table id="salaryTable">
          <thead>
            <tr>
              <th>Post</th>
              <th>Mans</th>
              <th>Salary per Man</th>
              <th>Total Salary</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td colspan="3"><strong>Total:</strong></td>
              <td id="totalSalary">0</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="add-row">
        <input type="text" id="newPost" placeholder="Post">
        <input type="number" id="newMans" placeholder="Mans">
        <input type="number" id="newSalary" placeholder="Salary per Man">
        <button onclick="addRow()">Add</button>
      </div>
    </div>

    <!-- Contract Management Section -->
    <div class="section contract">
      <h2>Contract Management</h2>
      <div class="table-container">
        <table id="contractTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Profit ($)</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td><strong>Total Profit:</strong></td>
              <td id="totalProfit">0</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="add-row">
        <input type="text" id="contractName" placeholder="Contract Name">
        <input type="number" id="contractProfit" placeholder="Profit">
        <button onclick="addContract()">Add Contract</button>
      </div>
    </div>

    <!-- Asset Management Section -->
    <div class="section asset">
      <h2>Asset Management</h2>
      <div class="table-container">
        <table id="assetTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Country</th>
              <th>Quantity</th>
              <th>km<sup>2</sup></th>
              <th>Rent</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td><strong>Total Rent:</strong></td>
              <td id="totalAssetRent">0</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="add-row">
        <input type="text" id="assetName" placeholder="Name">
        <input type="text" list="kingdoms-data-list" id="assetKingdom" placeholder="Country">
        <datalist id="kingdoms-data-list"></datalist>
        <input value="1" type="number" id="assetQuantity" placeholder="Quantity">
        <input value="1" type="number" id="assetKm" placeholder="size">
        <button onclick="addAsset()">Add</button>
      </div>
    </div>
  </div>

</body>
<script type="module" src="./cms.js"></script>

</html>
