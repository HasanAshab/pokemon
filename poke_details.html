<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Pokémon Details</title>
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/move-card.css">
  <link rel="stylesheet" href="./assets/css/poke_details.css">
</head>
<body>
  <div class="container">
    <div class="blur-bg ">
      <div class="pokemon-choose-form">
        <input list="pokemon-data-list" class="pokemon-inp" id="pokemon-inp" />
      <datalist id="pokemon-data-list"></datalist>
      <button class="submit-btn" onclick="changePokemon()">submit</button>
      <button class="cancel-btn" onclick="closePokemonChooseForm()">close</button>
    </div>
  </div>
  <div class="blur-bg ">
    <div class="move-choose-interface">
      <div class="toolbar">
        <input onchange="showChoosedMoveDesc()" list="move-data-list" class="move-search-inp" id="move-search-inp" />
      <datalist id="move-data-list"></datalist>
      <button class="move-learn-btn" onclick="learnMove()">learn</button>
      <button class="cancel-btn" onclick="closeMoveChooseInterface()">close</button>
    </div>
    <p class="desc"></p>

  </div>
</div>
</div>
<div class="blur-bg">
<div class="stat-update-form" style="background-color:white; padding:40px">
<h3 class="stat-name">Stat name</h3>
<input class="stat-value-inp" type="text" />
<datalist data-property-name="nature" id="nature-data-list"></datalist>
<datalist data-property-name="items" id="items-data-list"></datalist>
<datalist data-property-name="types" id="types-data-list"></datalist>
<datalist data-property-name="abilities" id="abilities-data-list"></datalist>

<br>
<small>Tokens: <span id="remaining-token">0</span></small>
<br>
<button class="save-btn">save</button>
<button class="cancel-btn">cancel</button>
</div>
</div>

<!-- Ability Manager Modal -->
<div class="blur-bg">
<div class="manager-modal">
<h3>Manage Abilities</h3>
<div class="search-section">
  <input list="abilities-data-list" class="manager-search" id="ability-search" placeholder="Search abilities...">
  <button class="add-item-btn" onclick="addAbility()">Add</button>
</div>
<div class="current-items" id="current-abilities"></div>
<button class="close-manager-btn" onclick="closeAbilityManager()">Close</button>
</div>
</div>

<!-- Item Manager Modal -->
<div class="blur-bg">
<div class="manager-modal">
<h3>Manage Items</h3>
<div class="search-section">
  <input list="items-data-list" class="manager-search" id="item-search" placeholder="Search items...">
  <button class="add-item-btn" onclick="addItem()">Add</button>
</div>
<div class="current-items" id="current-items"></div>
<button class="close-manager-btn" onclick="closeItemManager()">Close</button>
</div>
</div>

<!-- Type Manager Modal -->
<div class="blur-bg">
<div class="manager-modal">
<h3>Manage Types</h3>
<div class="search-section">
  <input list="types-data-list" class="manager-search" id="type-search" placeholder="Search types...">
  <button class="add-item-btn" onclick="addType()">Add</button>
</div>
<div class="current-items" id="current-types"></div>
<button class="close-manager-btn" onclick="closeTypeManager()">Close</button>
</div>
</div>
<!-- Header -->
<div class="header">
<button class="back-btn" onclick="history.back()">←</button>
<h1 class="pokemon-name" id="pokemon-name">Pokemon_name</h1>
<button onclick="showPokemonChooseForm()" class="pokemon-change-btn">&#9999;</button>
</div>
<!-- Stats Section -->
 
<div class="stats-header">
<div onclick="healthProgressBarClickHandler(event)" class="health-progress-bar" data-total-hp="0" data-current-hp="0">
<span class="health-data"><span class="current-hp">0</span> / <span class="total-hp">0</span>
</span>
<div class="inner">
&nbsp;
</div>
</div>
<span class="pokemon-cp" data-token-used="+0" data-value="0">Cp:</span>
</div>
<div class="genetics" style="display: flex; justify-content: center; padding: 10px; flex-direction: column; gap: 10px;">
     <label class="gen-data">
    Nation
    <select class="nation-select" onchange="updateGen(event.currentTarget.value, 'nation_genetics')"></select>
   </label>
   <label class="gen-data">
    Age
    <select class="age-select" onchange="updateGen(event.currentTarget.value, 'age_genetics')"></select>
   </label>
   <label class="gen-data">
    Food
    <select class="food-select" onchange="updateGen(event.currentTarget.value, 'food_genetics')"></select>
   </label>
   <label class="gen-data">
    Body
    <select class="body-select" onchange="updateGen(event.currentTarget.value, 'body_genetics')"></select>
   </label>
 </div>
<div class="stats-header-secondary">
  <!-- Abilities Section -->
  <div class="stat-group abilities-group">
    <div class="stat-header">
      <strong>Abilities:</strong>
      <button class="add-btn" onclick="showAbilityManager()">+</button>
    </div>
    <div class="abilities-list" id="abilities-list"></div>
  </div>

  <!-- Items Section -->
  <div class="stat-group items-group">
    <div class="stat-header">
      <strong>Items:</strong>
      <button class="add-btn" onclick="showItemManager()">+</button>
    </div>
    <div class="items-list" id="items-list"></div>
  </div>

  <!-- Types Section -->
  <div class="stat-group types-group">
    <div class="stat-header">
      <strong>Types:</strong>
      <button class="add-btn" onclick="showTypeManager()">+</button>
    </div>
    <div class="types-list" id="types-list"></div>
  </div>

  <!-- Nature and Stats -->
  <div data-value="none" onclick="statClickHandler(event)" class="stat nature">
    <strong>Nature:</strong>
  </div>
  <div onclick="statClickHandler(event)" data-value="0" class="stat wins-count">
    <strong style="color:darkgreen">Wins:</strong>
  </div>
  <div onclick="statClickHandler(event)" data-value="0" class="stat loses-count">
    <strong style="color:darkred">Loses:</strong>
  </div>
</div>
<div class="mega-controller">
    <button class="mega-btn" onclick="megaBtnClickHandler(event)">Mega</button>
    <select class="mega-suffix-select" onchange="setMegaSuffix(event.currentTarget.value)">
        <option value="mega">Mega</option>
        <option value="megax">Mega X</option>
        <option value="megay">Mega Y</option>
        <option value="megaz">Mega Z</option>
        <option value="bond">Bond</option>
        <option value="ash">Ash</option>
    
    </select>
</div>
<div class="stats">
<div class="stats-row">
<div data-token-used="0" data-value="0" onclick="statClickHandler(event)" class="stat hp">
<strong>HP:</strong>
</div>
<div data-token-used="0" data-value="0" onclick="statClickHandler(event)" class="stat atk">
<strong>ATK:</strong>
</div>
<div data-token-used="0" data-value="0" onclick="statClickHandler(event)" class="stat def">
<strong>DEF:</strong>
</div>

<div data-token-used="0" data-value="0" onclick="statClickHandler(event)" class="stat spe">
<strong>SPEED:</strong>
</div>
<div data-value="0kg" onclick="statClickHandler(event)" class="stat weight">
<strong>Weight:</strong>
</div>
</div>
<div class="stats-row">
<div data-value="0" onclick="statClickHandler(event)" class="stat level">
<strong>LVL:</strong>
</div>
<div data-value="0" onclick="statClickHandler(event)" class="stat xp">
<strong>XP:</strong>
</div>
<div data-value="0" onclick="statClickHandler(event)" class="stat retreat">
<strong>Retreat:</strong>
</div>
<div data-token-used="0" data-value="0" onclick="statClickHandler(event)" class="stat spa">
<strong>SP. ATK:</strong>
</div>
<div data-token-used="0" data-value="0" onclick="statClickHandler(event)" class="stat spd">
<strong>SP. DEF:</strong>
</div>
<div data-token-used="0" data-value="0" onclick="statClickHandler(event)" class="stat total">
<strong>TOTAL:</strong>
</div>
</div>
</div>
<!-- Moves Section -->
<div class="moves-header">
<h2>Moves - 10</h2>
</div>
<button id="add-move-btn" onclick="showMoveChooseInterface()">add move</button>
<div id="moves-container"></div>
</div>
</body>
<script src="./assets/js/poke_details.js" type="module">
</script>
</html>
